<style>
  :root{
    --bg0:#05090f; --bg1:#0a1420; --bg2:#0d1b2a;
    --cream:#eef3ef; --muted:#7e93a1;
    --g1:#52e6a8; --g2:#1fae76; --g3:#0d6b48;
    --gold:#d9b876;
    --navy:#13233a;
    --font:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;
    --ease:cubic-bezier(.16,.84,.24,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    height:100vh;height:100dvh;font-family:var(--font);color:var(--cream);
    background:
      radial-gradient(1100px 620px at 50% -6%, rgba(82,230,168,.12), transparent 60%),
      radial-gradient(900px 640px at 100% 110%, rgba(217,184,118,.08), transparent 60%),
      linear-gradient(180deg,var(--bg0),var(--bg1) 55%,var(--bg0));
    -webkit-font-smoothing:antialiased;position:relative;
  }
  :focus-visible{outline:2.5px solid var(--g1);outline-offset:3px}

  /* faint circuit grid */
  .grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
    background-image:linear-gradient(rgba(82,230,168,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(82,230,168,.08) 1px,transparent 1px);
    background-size:54px 54px;
    -webkit-mask-image:radial-gradient(60% 55% at 50% 38%,#000 0%,transparent 75%);
            mask-image:radial-gradient(60% 55% at 50% 38%,#000 0%,transparent 75%)}
  .vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,transparent 40%,rgba(0,0,0,.6) 100%)}

  .wrap{position:relative;z-index:2;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;
    padding:calc(env(safe-area-inset-top,0px) + clamp(10px,2vh,24px)) clamp(16px,5vw,56px) calc(env(safe-area-inset-bottom,0px) + clamp(8px,1.6vh,16px))}

  header{display:flex;justify-content:space-between;align-items:center;gap:14px;opacity:0;animation:drop .7s var(--ease) .1s forwards}
  @keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  .eyebrow{display:flex;align-items:center;gap:10px;font-size:.76rem;letter-spacing:.12em;color:var(--muted);font-weight:500;direction:ltr}
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--g1);box-shadow:0 0 8px var(--g1);position:relative}
  .eyebrow i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--g1);animation:ping 2.4s ease-out infinite}
  @keyframes ping{from{transform:scale(.6);opacity:.8}to{transform:scale(2.4);opacity:0}}
  .lang{font:600 .84rem var(--font);color:var(--cream);background:rgba(238,243,239,.06);border:1px solid rgba(238,243,239,.16);
    border-radius:999px;padding:9px 20px;cursor:pointer;transition:background .25s,border-color .25s,color .25s}
  .lang:hover{background:var(--g1);border-color:var(--g1);color:#06110c}

  main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(6px,1.4vh,14px);padding:clamp(2px,1vh,10px) 0;min-height:0}

  /* ---------- logo stage: converging evidence effect ---------- */
  .stage{position:relative;width:min(560px,78vw);aspect-ratio:16/9;max-height:26vh;margin:0 auto;flex:0 0 auto}
  .stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .lead-line{fill:none;stroke-width:1.6;stroke-linecap:round;opacity:0;stroke-dasharray:6 7}
  .lead-line.c1{stroke:rgba(82,230,168,.55)}
  .lead-line.c2{stroke:rgba(31,174,118,.5)}
  .lead-line.c3{stroke:rgba(217,184,118,.45)}
  .lead-line{animation:lineIn 1.2s var(--ease) forwards, dash 3.6s linear infinite}
  @keyframes lineIn{to{opacity:1}}
  @keyframes dash{to{stroke-dashoffset:-130}}
  .node{opacity:0;animation:nodeIn .7s var(--ease) forwards}
  @keyframes nodeIn{to{opacity:1}}
  .node rect{fill:rgba(82,230,168,.14);stroke:rgba(82,230,168,.6);stroke-width:1}
  .node.gold rect{fill:rgba(217,184,118,.14);stroke:rgba(217,184,118,.65)}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  .logo-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58%;max-width:420px}
  .logo-core .halo{position:absolute;inset:-55% -30%;border-radius:50%;
    background:radial-gradient(closest-side,rgba(82,230,168,.30),rgba(82,230,168,.06) 55%,transparent 75%);
    opacity:0;animation:fade 1.6s ease .6s forwards, breathe 5s ease-in-out 2.2s infinite}
  @keyframes fade{to{opacity:1}}
  @keyframes breathe{50%{transform:scale(1.07);opacity:.75}}
  .logo-core .ring{position:absolute;inset:-20% -4%;border-radius:999px;opacity:0;animation:fade 1s ease .9s forwards}
  .logo-core .ring svg{width:100%;height:100%}
  .logo-core .ring .d{stroke-dasharray:4 9;animation:spin 46s linear infinite}
  .logo-core .ring .d2{animation:spin 60s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .logo-core img{position:relative;display:block;width:100%;height:auto;margin:0 auto;
    opacity:0;filter:drop-shadow(0 0 22px rgba(82,230,168,.35));transform:scale(.9);
    animation:logoIn 1s var(--ease) .75s forwards}
  @keyframes logoIn{to{opacity:1;transform:none}}
  .scan{position:absolute;left:4%;right:4%;height:2px;top:0;
    background:linear-gradient(90deg,transparent,var(--g1),transparent);
    box-shadow:0 0 18px 3px rgba(82,230,168,.7);opacity:0;
    animation:scan 2.6s var(--ease) 1.7s infinite}
  @keyframes scan{0%{top:6%;opacity:0}8%{opacity:1}92%{opacity:1}100%{top:94%;opacity:0}}

  .badge{display:inline-flex;align-items:center;gap:9px;font-size:.76rem;font-weight:700;letter-spacing:.07em;
    color:#9fe8c7;background:rgba(82,230,168,.08);border:1px solid rgba(82,230,168,.35);
    border-radius:999px;padding:6px 16px;margin-top:2px;flex:0 0 auto;
    opacity:0;animation:rise .8s var(--ease) 1.9s forwards}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  h1{font-weight:800;line-height:1.16;font-size:clamp(1.7rem,4.6vh,3.3rem);flex:0 0 auto;
    opacity:0;animation:rise .85s var(--ease) 2.05s forwards}
  h1 .w1{background:linear-gradient(100deg,#fff 0%,#dff6ea 35%,var(--g1) 50%,#dff6ea 65%,#fff 100%);
    background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    animation:shine 7s linear 3.2s infinite;display:inline-block}
  h1 .w2{position:relative;display:inline-block;color:var(--cream)}
  h1 .w2::after{content:"";position:absolute;left:0;right:0;bottom:-.08em;height:.09em;border-radius:3px;
    background:linear-gradient(90deg,var(--gold),#f3e2b4,var(--gold));transform:scaleX(0);transform-origin:right center;
    animation:underline .9s var(--ease) 2.9s forwards}
  html[dir="ltr"] h1 .w2::after{transform-origin:left center}
  @keyframes underline{to{transform:scaleX(1)}}
  @keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}

  .lead{max-width:46ch;font-size:clamp(.98rem,2vw,1.12rem);line-height:1.9;color:#b9c9cf;font-weight:400;
    opacity:0;animation:rise .85s var(--ease) 2.2s forwards}
  .tag{margin-top:2px;font-weight:700;font-size:clamp(.95rem,2vw,1.08rem);
    background:linear-gradient(90deg,var(--gold),#f0dca3,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;animation:rise .85s var(--ease) 2.35s forwards}

  /* journey */
  .journey{display:flex;justify-content:center;align-items:flex-start;gap:0;max-width:720px;width:100%;margin-top:clamp(10px,2vh,20px);flex:0 0 auto;
    opacity:0;animation:rise .85s var(--ease) 2.2s forwards}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;padding:0 4px}
  .step .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.82rem;font-variant-numeric:lining-nums;direction:ltr;
    background:linear-gradient(160deg,rgba(82,230,168,.18),rgba(13,107,72,.1));border:1px solid rgba(82,230,168,.45);color:var(--g1)}
  .step span{font-size:.74rem;color:var(--cream);font-weight:700;line-height:1.35}
  .step::after{content:"";position:absolute;top:16px;inset-inline-start:calc(50% + 20px);width:calc(100% - 40px);height:1px;
    background:linear-gradient(90deg,rgba(82,230,168,.5),rgba(82,230,168,.05))}
  html[dir="ltr"] .step::after{background:linear-gradient(90deg,rgba(82,230,168,.5),rgba(82,230,168,.05))}
  .step:last-child::after{display:none}

  .cta{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:.94rem;color:#06110c;
    background:linear-gradient(135deg,var(--g1),var(--g2));padding:13px 28px;border-radius:999px;position:relative;margin-top:clamp(10px,2vh,20px);flex:0 0 auto;
    box-shadow:0 14px 32px -12px rgba(82,230,168,.55);transition:transform .25s,box-shadow .25s;
    opacity:0;animation:rise .85s var(--ease) 2.45s forwards}
  .cta:hover{transform:translateY(-2px);box-shadow:0 18px 38px -12px rgba(82,230,168,.75)}
  .cta svg{width:17px;height:17px}
  .cta::before{content:"";position:absolute;inset:-6px;border-radius:999px;border:1px solid rgba(82,230,168,.5);animation:ring 2.8s ease-out 3.2s infinite}
  @keyframes ring{from{transform:scale(.96);opacity:.9}to{transform:scale(1.14,1.5);opacity:0}}

  footer{padding-top:clamp(6px,1.4vh,14px);display:flex;flex-wrap:wrap;justify-content:center;gap:6px 24px;font-size:.78rem;color:var(--muted);direction:ltr;flex:0 0 auto;
    opacity:0;animation:drop .8s var(--ease) 2.6s forwards}
  footer a,footer span{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:color .2s}
  footer a:hover{color:var(--g1)}
  footer i{width:5px;height:5px;border-radius:50%;background:var(--g1)}

  @media (max-width:640px){
    .journey{flex-wrap:wrap;row-gap:10px;column-gap:4px}
    .step{flex:0 0 46%}
    .step::after{display:none}
    .stage{max-height:19vh;width:min(420px,66vw)}
    h1{font-size:clamp(1.5rem,4.2vh,2.2rem)}
    footer{gap:4px 16px;font-size:.72rem}
  }
  @media (max-height:700px){
    .stage{max-height:17vh}
    h1{font-size:clamp(1.3rem,3.6vh,2rem)}
    .journey{margin-top:8px}
    .cta{margin-top:8px;padding:11px 24px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
    header,.badge,h1,.journey,.cta,footer,.node,.lead-line,.logo-core img,.logo-core .halo,.logo-core .ring{opacity:1}
  }
</style>
</head>
